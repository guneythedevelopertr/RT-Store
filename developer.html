<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RT Store — Geliştirici Ol</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="topbar">
        <a href="index.html" class="logo">RT Store</a>
        <nav class="nav-links">
            <a href="index.html">Ana Sayfa</a>
            <a href="apps.html">Uygulamalar</a>
            <a href="developer.html">Geliştirici Ol</a>
            <a href="login.html">Giriş Yap</a>
        </nav>
    </header>
    <main class="container">
        <div class="auth-box">
            <h2>Geliştirici Başvurusu</h2>
            <p style="font-size:13px; color:#86868b; margin-bottom:20px;">Uygulamanızı RT Store ekosistemine dahil edin.</p>
            <form id="dev-form" onsubmit="event.preventDefault(); alert('Başvurunuz alındı!');">
                <div class="form-group">
                    <label>Uygulama Adı</label>
                    <input type="text" required placeholder="Uygulama Adı">
                </div>
                <div class="form-group">
                    <label>Açıklama</label>
                    <textarea rows="4" required placeholder="Uygulama detayları..."></textarea>
                </div>
                <button type="submit" class="btn-primary" style="width:100%;">Başvuruyu Gönder</button>
            </form>
        </div>
    </main>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
</body>
</html>
