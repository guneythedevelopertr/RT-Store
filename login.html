<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RT Store — Giriş Yap</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 60px auto;
            padding: 30px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .auth-container h1 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #1d1d1f;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #333;
        }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            font-size: 14px;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #0071e3;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: #0077ed;
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a href="index.html" class="logo">RT Store</a>
        <nav class="nav-links">
            <a href="index.html">Ana Sayfa</a>
            <a href="apps.html">Uygulamalar</a>
            <a href="developer.html">Geliştirici Ol</a>
            <a href="login.html">Giriş Yap</a>
        </nav>
    </header>
    
    <main class="container">
        <div class="auth-container">
            <h1>Hesabınıza Giriş Yapın</h1>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">E-posta Adresi</label>
                    <input type="email" id="email" required placeholder="ornek@domain.com">
                </div>
                <div class="form-group">
                    <label for="password">Şifre</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-submit">Giriş Yap</button>
            </form>
        </div>
    </main>
    
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
</body>
</html>
