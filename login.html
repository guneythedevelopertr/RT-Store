<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RT Store — Hesap Yönetimi</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="topbar">
        <a href="index.html" class="logo">RT Store</a>
        <nav class="nav-links">
            <a href="index.html">Ana Sayfa</a>
            <a href="apps.html">Uygulamalar</a>
            <a href="developer.html">Geliştirici Ol</a>
            <a href="login.html">Giriş Yap</a>
        </nav>
    </header>
    <main class="container">
        <div class="auth-box">
            <h2>Yeni Hesap Oluştur</h2>
            <form id="register-form">
                <div class="form-group">
                    <label for="username">Kullanıcı Adı</label>
                    <input type="text" id="username" required placeholder="kullanici_adi">
                </div>
                <div class="form-group">
                    <label for="email">E-posta Adresi</label>
                    <input type="email" id="email" required placeholder="ornek@domain.com">
                </div>
                <div class="form-group">
                    <label for="password">Şifre (8-16 Karakter)</label>
                    <input type="password" id="password" required minlength="8" maxlength="16" placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label for="confirm-password">Şifre Tekrar</label>
                    <input type="password" id="confirm-password" required minlength="8" maxlength="16" placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary" style="width:100%;">Kayıt Ol</button>
            </form>
        </div>
    </main>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
</body>
</html>
